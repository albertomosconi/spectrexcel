name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  browser:
    name: Rendered website / Chromium
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group browser
      - run: uv run python -m playwright install --with-deps chromium
      - run: uv run pytest -q tests/test_site_browser.py

  gui:
    name: Rendered desktop dialogs / Linux
    runs-on: ubuntu-22.04
    env:
      SPECTREXCEL_GUI_TESTS: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0
      - run: uv sync --frozen
      - name: Render dialogs at normal and doubled scale
        run: xvfb-run -a -s "-screen 0 1920x1200x24" uv run pytest -q tests/test_dialogs.py::test_rendered_dialog_content_and_actions_fit_after_resize

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            os: windows-latest
            artifact: spectrexcel-windows-x86_64
            path: dist/spectrexcel-windows-x86_64.exe
          - name: Linux x86-64
            os: ubuntu-22.04
            artifact: SpectrExcel-linux-x86_64
            path: |
              dist/SpectrExcel-x86_64.AppImage
              dist/SpectrExcel-x86_64.AppImage.tar.gz
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-default-groups --group build
      - run: uv run --no-sync build
      - name: Name Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item dist/spectrexcel.exe dist/spectrexcel-windows-x86_64.exe
      - name: Install pinned appimagetool
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/AppImage/appimagetool/releases/assets/324406882 \
            --output appimagetool
          curl --fail --location --retry 3 \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/AppImage/type2-runtime/releases/assets/326011592 \
            --output runtime-x86_64
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimagetool" | sha256sum --check -
          # type2-runtime 20251108: dated release, not the mutable continuous build.
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64" | sha256sum --check -
          chmod +x appimagetool
      - name: Build AppImage
        if: runner.os == 'Linux'
        run: sh packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

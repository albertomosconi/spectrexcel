name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
      - name: Match tag and project version
        run: |
          project_version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v$project_version"

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            os: windows-latest
            artifact: spectrexcel-windows-x86_64
            path: dist/spectrexcel-windows-x86_64.exe
          - name: Linux x86-64
            os: ubuntu-22.04
            artifact: SpectrExcel-linux-x86_64
            path: |
              dist/SpectrExcel-x86_64.AppImage
              dist/SpectrExcel-x86_64.AppImage.tar.gz
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv sync --frozen --no-default-groups --group build
      - run: uv run --no-sync build
      - name: Name Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item dist/spectrexcel.exe dist/spectrexcel-windows-x86_64.exe
      - name: Install pinned appimagetool
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/AppImage/appimagetool/releases/assets/324406882 \
            --output appimagetool
          curl --fail --location --retry 3 \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/AppImage/type2-runtime/releases/assets/456065460 \
            --output runtime-x86_64
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimagetool" | sha256sum --check -
          echo "1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf  runtime-x86_64" | sha256sum --check -
          chmod +x appimagetool
      - name: Build AppImage
        if: runner.os == 'Linux'
        run: sh packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Generate release notes
        run: |
          set -euo pipefail
          prev_tag=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
          range="${prev_tag:+$prev_tag..}$RELEASE_TAG"

          section_items() {
            git log --pretty=format:'%s' "$range" | grep -E "$1" | sed -E 's/^[a-z]+(\([^)]*\))?!?: //' || true
          }

          {
            echo "## What's Changed"

            features=$(section_items '^(feat|perf)(\([^)]*\))?!?: ')
            if [ -n "$features" ]; then
              echo
              echo "### Features"
              echo "$features" | sed 's/^/- /'
            fi

            fixes=$(section_items '^(fix|revert)(\([^)]*\))?!?: ')
            if [ -n "$fixes" ]; then
              echo
              echo "### Bug Fixes"
              echo "$fixes" | sed 's/^/- /'
            fi

            others=$(git log --pretty=format:'%s' "$range" \
              | grep -vE '^(feat|perf|fix|revert)(\([^)]*\))?!?: ' \
              | grep -vE '^chore: bump version' \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: //' || true)
            if [ -n "$others" ]; then
              echo
              echo "### Other Changes"
              echo "$others" | sed 's/^/- /'
            fi

            if [ -n "$prev_tag" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev_tag...$RELEASE_TAG"
            fi
          } > release-notes.md
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksum manifest
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --notes-file release-notes.md --title "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
